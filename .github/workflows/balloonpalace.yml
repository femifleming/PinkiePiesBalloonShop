name: balloon palace (spatial audio)

# Pinkie Pie's Balloon Palace, the spatial audio (Ambisonics) version of the shop, in the BalloonPalace folder.
# Builds when it changes; a tag balloonpalace-vX.Y.Z makes its own release (separate from the shop's vX.Y.Z).
on:
  push:
    branches: [ main ]
    tags: [ 'balloonpalace-v*' ]
    paths: [ 'BalloonPalace/**', '.github/workflows/balloonpalace.yml' ]
  pull_request:
    paths: [ 'BalloonPalace/**', '.github/workflows/balloonpalace.yml' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: "Pinkie Pies Balloon Palace"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: PinkiePiesBalloonPalace-macOS.zip
          - name: Windows
            os: windows-latest
            package: PinkiePiesBalloonPalace-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            package: PinkiePiesBalloonPalace-Linux.tar.gz
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev ninja-build xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S BalloonPalace -B build $GEN -DCMAKE_BUILD_TYPE=Release -DBALLOONPALACE_BUILD_TESTS=ON -DBALLOONPALACE_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --target BalloonPalace_All --parallel 4

      # the sound checks, on every system: the same offline tests as on the Mac (the full-interface
      # host tests stay on the Mac); Linux runs them on a virtual display
      - name: Test
        shell: bash
        run: |
          cmake --build build --config Release --target BalloonPalaceTest BalloonPalaceSphereTest --parallel 4
          for t in BalloonPalaceTest BalloonPalaceSphereTest; do
            exe=$(find build -path "*${t}_artefacts*" -type f \( -name "$t" -o -name "$t.exe" \) | head -1)
            echo "== $t: $exe"
            set +e
            if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$exe"; else "$exe"; fi
            code=$?
            set -e
            echo "== $t exit code $code"
            [ $code -eq 0 ] || fails=$((fails + 1))
          done
          exit ${fails:-0}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/BalloonPalace_artefacts/Release
          mkdir -p "dist/$NAME"
          cp -R "$A/Standalone/$NAME.app" "$A/AU/$NAME.component" "$A/VST3/$NAME.vst3" "dist/$NAME/"
          codesign --force --deep -s - "dist/$NAME/$NAME.app"
          codesign --force --deep -s - "dist/$NAME/$NAME.component"
          codesign --force --deep -s - "dist/$NAME/$NAME.vst3"
          cp BalloonPalace/README.md LICENSE "dist/$NAME/"
          cp "BalloonPalace/docs/manual/Pinkie Pies Balloon Palace Manual.pdf" "dist/$NAME/"
          cd dist && ditto -c -k --keepParent "$NAME" "${{ matrix.package }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/BalloonPalace_artefacts/Release"
          New-Item -ItemType Directory -Force "dist/$env:NAME" | Out-Null
          Copy-Item -Recurse "$A/VST3/$env:NAME.vst3" "dist/$env:NAME/"
          Copy-Item "$A/Standalone/$env:NAME.exe" "dist/$env:NAME/"
          Copy-Item BalloonPalace/README.md, LICENSE "dist/$env:NAME/"
          Copy-Item "BalloonPalace/docs/manual/Pinkie Pies Balloon Palace Manual.pdf" "dist/$env:NAME/"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/${{ matrix.package }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          A=build/BalloonPalace_artefacts/Release
          mkdir -p "dist/$NAME"
          cp -R "$A/VST3/$NAME.vst3" "$A/LV2/$NAME.lv2" "dist/$NAME/"
          cp "$A/Standalone/$NAME" "dist/$NAME/"
          cp BalloonPalace/README.md LICENSE "dist/$NAME/"
          cp "BalloonPalace/docs/manual/Pinkie Pies Balloon Palace Manual.pdf" "dist/$NAME/"
          tar -czf "dist/${{ matrix.package }}" -C dist "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/balloonpalace-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: The manual
        run: cp "BalloonPalace/docs/manual/Pinkie Pies Balloon Palace Manual.pdf" packages/
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Pinkie Pie's Balloon Palace (spatial audio) ${{ github.ref_name }}
          make_latest: false   # (the repo's "latest" release stays the Balloon Shop's: its README links to it)
          files: packages/*
          generate_release_notes: true
