name: mellyloon (spatial audio)

# Mellyloon, the spatial audio (3rd-order Ambisonics) version of the shop, in the Mellyloon folder.
# Builds when it changes; a tag mellyloon-vX.Y.Z makes its own release (separate from the shop's vX.Y.Z).
on:
  push:
    branches: [ main ]
    tags: [ 'mellyloon-v*' ]
    paths: [ 'Mellyloon/**', '.github/workflows/mellyloon.yml' ]
  pull_request:
    paths: [ 'Mellyloon/**', '.github/workflows/mellyloon.yml' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: "Mellyloon"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: Mellyloon-macOS.zip
          - name: Windows
            os: windows-latest
            package: Mellyloon-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            package: Mellyloon-Linux.tar.gz
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S Mellyloon -B build $GEN -DCMAKE_BUILD_TYPE=Release -DMELLYLOON_BUILD_TESTS=OFF -DMELLYLOON_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --target Mellyloon_All --parallel 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/Mellyloon_artefacts/Release
          mkdir -p "dist/$NAME"
          cp -R "$A/Standalone/$NAME.app" "$A/AU/$NAME.component" "$A/VST3/$NAME.vst3" "dist/$NAME/"
          codesign --force --deep -s - "dist/$NAME/$NAME.app"
          codesign --force --deep -s - "dist/$NAME/$NAME.component"
          codesign --force --deep -s - "dist/$NAME/$NAME.vst3"
          cp Mellyloon/README.md LICENSE "dist/$NAME/"
          cd dist && ditto -c -k --keepParent "$NAME" "${{ matrix.package }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/Mellyloon_artefacts/Release"
          New-Item -ItemType Directory -Force "dist/$env:NAME" | Out-Null
          Copy-Item -Recurse "$A/VST3/$env:NAME.vst3" "dist/$env:NAME/"
          Copy-Item "$A/Standalone/$env:NAME.exe" "dist/$env:NAME/"
          Copy-Item Mellyloon/README.md, LICENSE "dist/$env:NAME/"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/${{ matrix.package }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          A=build/Mellyloon_artefacts/Release
          mkdir -p "dist/$NAME"
          cp -R "$A/VST3/$NAME.vst3" "$A/LV2/$NAME.lv2" "dist/$NAME/"
          cp "$A/Standalone/$NAME" "dist/$NAME/"
          cp Mellyloon/README.md LICENSE "dist/$NAME/"
          tar -czf "dist/${{ matrix.package }}" -C dist "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/mellyloon-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Mellyloon (spatial audio) ${{ github.ref_name }}
          files: packages/*
          generate_release_notes: true
